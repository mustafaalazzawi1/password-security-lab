name: Verify evidence and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check recorded evidence
        run: python verify_evidence.py evidence/run-20261125
      - name: Exercise malformed and inconsistent evidence
        run: python -m unittest discover -s tests -v
      - name: Keep validation active under optimized Python
        run: python -O -m unittest discover -s tests -v
